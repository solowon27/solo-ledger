<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Solo Ledgers Electric Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Emerald Growth Gradient (Money / Rate Accent) -->
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Soft Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.6" />

  <!-- The "SoloLedger S" Emblem: Geometric Folded Financial Ledger -->
  <g filter="url(#shadow)">
    <!-- Top Bar of S (Growth Heading Right) -->
    <path d="M 170 145 H 315 C 345 145 365 165 365 195 C 365 225 345 245 315 245 H 220" 
          fill="none" 
          stroke="url(#blueGlow)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bottom Bar of S (Foundation Returning Left) -->
    <path d="M 342 367 H 197 C 167 367 147 347 147 317 C 147 287 167 267 197 267 H 292" 
          fill="none" 
          stroke="url(#blueGlow)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Currency Node / Pivot -->
    <circle cx="256" cy="256" r="22" fill="url(#emeraldAccent)" filter="url(#neonGlow)" />
    
    <!-- Top-Right Growth Indicator Node (Target / Yield) -->
    <circle cx="365" cy="145" r="16" fill="url(#emeraldAccent)" filter="url(#neonGlow)" />
  </g>

  <!-- Clean Grid Sub-Lines (Subtle Ledger Detail) -->
  <line x1="160" y1="410" x2="352" y2="410" stroke="#334155" stroke-width="4" stroke-linecap="round" opacity="0.5" />
</svg>
